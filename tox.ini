[globals]
sort_lint_format_files = src test

[tox]
envlist = clean,py{313},lint,type
skip_missing_interpreters = True
skipsdist = True

[testenv]
allowlist_externals = poetry
commands = 
    poetry install -v
    poetry run pytest --cov --cov-append --junitxml=coverage/test-results.xml --cov-report html:coverage/htmlcov --cov-report xml:coverage/coverage.xml --cov-report term:skip-covered
    mypy {[globals]sort_lint_format_files}
    ruff check --fix {[globals]sort_lint_format_files}
    ruff format {[globals]sort_lint_format_files}

[testenv:lint]
allowlist_externals = poetry
commands = 
    poetry install -v
    ruff check --fix {[globals]sort_lint_format_files}
    ruff format {[globals]sort_lint_format_files}

[testenv:type]
allowlist_externals = poetry
commands = 
    poetry install -v
    mypy {[globals]sort_lint_format_files}

[testenv:clean]
deps = coverage[toml]
skip_install = true
commands = coverage erase