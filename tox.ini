[globals]
sort_lint_format_files = src test

[tox]
envlist = clean,py{312,313},lint,type
skip_missing_interpreters = True

[testenv]
package = skip
allowlist_externals = poetry
commands =
    poetry install -v
    poetry run pytest --cov --cov-append --junitxml=coverage/test-results.xml --cov-report html:coverage/htmlcov --cov-report xml:coverage/coverage.xml --cov-report term:skip-covered
    poetry run mypy {[globals]sort_lint_format_files}
    poetry run ruff check --fix {[globals]sort_lint_format_files}
    poetry run ruff format {[globals]sort_lint_format_files}

[testenv:lint]
package = skip
allowlist_externals = poetry
commands =
    poetry install -v
    poetry run ruff check --fix {[globals]sort_lint_format_files}
    poetry run ruff format {[globals]sort_lint_format_files}

[testenv:lint-ci]
package = skip
allowlist_externals = poetry
commands =
    poetry install -v
    poetry run ruff check {[globals]sort_lint_format_files}
    poetry run ruff format --check {[globals]sort_lint_format_files}

[testenv:type]
package = skip
allowlist_externals = poetry
commands =
    poetry install -v
    poetry run mypy {[globals]sort_lint_format_files}

[testenv:clean]
deps = coverage[toml]
skip_install = true
commands = coverage erase
