[tool.poetry]
name = "python_template"
version = "2.0.0"
description = "An opinionated project template for Python built with poetry"
license = "GPL-3.0"
authors = ["Justin Baur <justinbaur@outlook.com>"]
readme = "README.md"
repository = "https://github.com/justinbaur/python-template"
packages = [
    {include = "python_template", from = "src"}
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
coverage = {extras = ["toml"], version = "^7.6"}
pytest = "^8.3"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
mypy = "^1.14"
ruff = "^0.6"
tox = "^4.20"

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
show_error_codes = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
addopts = "-vv"
pythonpath = ["src"]
testpaths = ["test"]

[tool.coverage.run]
branch = true
include = ["src/*"]
omit = ["**/domain/**", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
include = ["src/*"]
omit = ["**/domain/**", "**/__init__.py"]