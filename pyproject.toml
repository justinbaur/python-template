[tool.poetry]
name = "python_template"
version = "2.0.0"
description = "An opinionated project template for Python built with poetry"
license = "GPL-3.0"
authors = ["Justin Baur <justinbaur@outlook.com>"]
readme = "README.md"
repository = "https://github.com/justinbaur/python-template"
packages = [
    {include = "python_template", from = "src"}
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
coverage = {extras = ["toml"], version = "7.13.5"}
pytest = "^9.0"
pytest-cov = "^7.1"
pytest-mock = "^3.15"
mypy = "^1.15"
ruff = ">=0.6"
tox = "^4.53"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "PT", "RUF", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "normal"
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
addopts = "-vv"
pythonpath = ["src"]
testpaths = ["test"]

[tool.coverage.run]
branch = true
include = ["src/*"]
omit = ["**/domain/**", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
include = ["src/*"]
omit = ["**/domain/**", "**/__init__.py"]